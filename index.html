<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mitonne</title>
<meta name="description" content="Batch cooking de la semaine selon les promotions Migros, Coop, Denner, Aldi et Lidl.">
<meta name="theme-color" content="#f2f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f151b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mitonne">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Barlow+Condensed:wght@600;700&family=Caveat:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Mitonne. Layout: one thumb-wide column, cool kitchen-tile neutrals, a paprika enamel accent,
   masking-tape labels for what goes in each box, and storage state in colour: fresh green, fridge teal, freezer blue.
   Layout: one thumb-wide column. A sticky strip names the brand and the freshness of the prices,
   five views sit behind a bottom tab bar, the week is prepared in a two-step flow,
   the batch session reads like a kitchen timeline, and the yellow shelf label is the only loud element. */
:root{
  --paper:#f2f5f7; --surface:#ffffff; --ink:#17222e; --ink-2:#596776; --line:#d8dfe5;
  --accent:#b9461b; --accent-ink:#ffffff; --accent-soft:#fbe9e0;
  --tag:#ffd43b; --tag-ink:#1c1a0c; --tag-plain:#e6ebef;
  --promo:#d22e26; --promo-ink:#ffffff;
  --note:#fff3c4; --note-ink:#4a3a00;
  --tape:#efe1b4; --tape-ink:#3e3420;
  --fresh:#2c7a4b; --fridge:#167684; --cold:#2f6fb8;
  --c1:#b9461b; --c2:#2c7a4b; --c3:#2f6fb8; --c4:#8a3d8f; --c5:#9a7300;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-price:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f151b; --surface:#17202a; --ink:#e7edf2; --ink-2:#9aa8b6; --line:#28343f;
    --accent:#f08a5a; --accent-ink:#1a0d06; --accent-soft:#3a2418;
    --tag:#ffd43b; --tag-ink:#1c1a0c; --tag-plain:#28343f;
    --promo:#e5483f; --promo-ink:#ffffff;
    --note:#3a3110; --note-ink:#f3e3a2;
    --tape:#5b5033; --tape-ink:#f6eac6;
    --fresh:#5cc28a; --fridge:#4cb8c6; --cold:#7fb0ee;
    --c1:#f08a5a; --c2:#5cc28a; --c3:#7fb0ee; --c4:#d18ad6; --c5:#e0bb45;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --paper:#0f151b; --surface:#17202a; --ink:#e7edf2; --ink-2:#9aa8b6; --line:#28343f;
    --accent:#f08a5a; --accent-ink:#1a0d06; --accent-soft:#3a2418;
    --tag:#ffd43b; --tag-ink:#1c1a0c; --tag-plain:#28343f;
    --promo:#e5483f; --promo-ink:#ffffff;
    --note:#3a3110; --note-ink:#f3e3a2;
    --tape:#5b5033; --tape-ink:#f6eac6;
    --fresh:#5cc28a; --fridge:#4cb8c6; --cold:#7fb0ee;
    --c1:#f08a5a; --c2:#5cc28a; --c3:#7fb0ee; --c4:#d18ad6; --c5:#e0bb45;
    color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--f-body); font-size:16px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font-family:inherit}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.app{max-width:640px;margin:0 auto;padding-bottom:calc(140px + env(safe-area-inset-bottom,0px))}
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:9; background:var(--paper);
  display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  padding-block:14px 10px; border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:8px;font:800 1.45rem/1 var(--f-display);font-stretch:118%;letter-spacing:-.01em}
.brand svg{width:30px;height:30px;flex:none}
.fresh{font-size:.8rem;color:var(--ink-2);text-align:right;min-width:0}

.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:9;
  background:var(--surface); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(8px,env(safe-area-inset-left,0px));
  padding-right:max(8px,env(safe-area-inset-right,0px));
}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:8px 2px; margin-top:-1px; border-top:3px solid transparent;
  color:var(--ink-2); text-decoration:none; font:600 .7rem var(--f-body);
}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}

#view{display:flex;flex-direction:column;gap:18px;padding-block:18px}
.h1{font:800 1.75rem/1.08 var(--f-display);font-stretch:112%;letter-spacing:-.01em;text-wrap:balance;margin:0}
.h2{font:800 1.15rem/1.2 var(--f-display);font-stretch:110%;margin:0;text-wrap:balance}
.lede{color:var(--ink-2);margin:0;font-size:.95rem;max-width:65ch}
.head{display:flex;flex-direction:column;gap:6px}

.save{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.save-n{font:700 2.6rem/1 var(--f-price);font-variant-numeric:tabular-nums;color:var(--accent)}
.save-n small{font-size:1rem;font-weight:600;margin-left:4px}
.save-l{font-size:.85rem;color:var(--ink-2);flex:1;min-width:14ch}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:999px; padding:.5rem .85rem; font:600 .85rem var(--f-body); cursor:pointer; min-height:38px;
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.label{font:700 .74rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0}
.block{display:flex;flex-direction:column;gap:10px}
.sect{display:flex;flex-direction:column;gap:14px;padding-top:16px;border-top:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.note{background:var(--note);color:var(--note-ink);border-radius:10px;padding:.7rem .85rem;font-size:.88rem;margin:0;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.empty{display:flex;flex-direction:column;gap:12px;padding-block:24px}

.btn{
  appearance:none; border:1px solid var(--line); background:transparent; color:var(--ink);
  border-radius:10px; padding:.6rem .9rem; font:600 .9rem var(--f-body); cursor:pointer; min-height:42px;
}
.btn.fill{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.wide{width:100%}
.btn.small{min-height:34px;padding:.35rem .7rem;font-size:.82rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.note .btn{border-color:currentColor;color:inherit}
.btn.icon{flex:none;width:46px;padding:0;display:grid;place-items:center}
.btn.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.btn.icon[aria-pressed="true"]{border-color:var(--promo);color:var(--promo)}
.btn.icon[aria-pressed="true"] svg{fill:var(--promo)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1;min-width:9rem}
.time{font:600 1rem var(--f-body);padding:.45rem .7rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-height:42px}

.store{
  align-self:flex-start; font:700 .68rem var(--f-body); letter-spacing:.07em; text-transform:uppercase;
  padding:.12rem .4rem; border:1px solid var(--line); border-radius:4px; color:var(--ink-2); white-space:nowrap;
}
.badge{display:inline-block;font:700 .7rem var(--f-body);letter-spacing:.04em;padding:.15rem .45rem;border-radius:4px;background:var(--tag-plain);color:var(--ink-2)}
.badge.cold{background:transparent;border:1px solid var(--cold);color:var(--cold)}
.badge.fresh{background:transparent;border:1px solid var(--fresh);color:var(--fresh)}
.badge.fridge{background:transparent;border:1px solid var(--fridge);color:var(--fridge)}
.badge.alt{background:var(--accent-soft);color:var(--accent)}
.badge.fit{background:var(--fresh);color:var(--paper)}
.macros{display:flex;flex-wrap:wrap;gap:2px 14px;margin:0;font-size:.8rem;color:var(--ink-2);align-items:baseline}
.macros b{font:700 1.15rem/1 var(--f-price);color:var(--ink);font-variant-numeric:tabular-nums;margin-right:2px}
.filters{display:flex;flex-direction:column;gap:12px;min-width:0}
.filters .block{min-width:0}
.chips.tight{gap:6px}
.chips.tight .chip{min-height:34px;padding:.35rem .7rem;font-size:.8rem}

.tag{display:inline-flex;align-items:stretch;border-radius:6px;overflow:hidden;font-family:var(--f-price);line-height:1;flex:none;font-variant-numeric:tabular-nums}
.tag-pct{background:var(--promo);color:var(--promo-ink);font-weight:700;font-size:.95rem;padding:0 .4rem;display:flex;align-items:center}
.tag-body{background:var(--tag);color:var(--tag-ink);padding:.3rem .5rem .35rem;display:flex;align-items:baseline;gap:.3rem}
.tag.plain .tag-body{background:var(--tag-plain);color:var(--ink)}
.tag-price{font-weight:700;font-size:1.45rem}
.tag-unit{font-size:.85rem;font-weight:600}
.tag-old{font-size:.85rem;font-weight:600;opacity:.65}

.cards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card[data-on="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card-head{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--ink-2);flex-wrap:wrap}
.card-name{font:700 1.15rem/1.22 var(--f-display);font-stretch:104%;margin:0;text-wrap:balance}
.card-sv{margin:-6px 0 0;color:var(--ink-2);font-size:.9rem}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.deal{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.deal-txt{min-width:0;display:flex;flex-direction:column;gap:3px;font-size:.88rem}
.deal-n{font-weight:600;overflow-wrap:anywhere}
.deal-s{color:var(--ink-2);font-size:.8rem}
.card-acts{display:flex;gap:8px}
.card-acts .btn:not(.icon){flex:1}

.next{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.next-k{font:700 .74rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.next-t{font:600 1.15rem/1.25 var(--f-display);margin:0}
.next-s{font-size:.88rem;color:var(--ink-2);margin:0}

.dayg{display:flex;flex-direction:column;gap:4px}
.dayh{margin:0;font:800 1.15rem var(--f-display);display:flex;gap:8px;align-items:baseline}
.dayh span{font:500 .85rem var(--f-body);color:var(--ink-2)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl-row{display:grid;grid-template-columns:3.3rem minmax(0,1fr) auto;gap:10px;align-items:start;padding:.65rem 0;border-bottom:1px solid var(--line)}
.tl-row:last-child{border-bottom:0}
.tl-time{font:700 1.05rem/1.3 var(--f-price);font-variant-numeric:tabular-nums}
.tl-body{min-width:0;display:flex;flex-direction:column;gap:3px}
.tl-k{display:inline-flex;align-items:center;gap:6px;font:700 .72rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.tl-k i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--ink-2));flex:none}
.tl-txt{font-size:.95rem;overflow-wrap:anywhere}
.tl-txt b{font-weight:600}
.tl-meta{font-size:.8rem;color:var(--ink-2)}
.tl-row.free .tl-txt{color:var(--ink-2);font-style:italic}
.tl-row.done .tl-txt,.tl-row.done .tl-meta{text-decoration:line-through;color:var(--ink-2)}
.tl-row.thaw .tl-k{color:var(--cold)}
.tl-row.big .tl-txt{font-weight:600}
.tl-row input{width:22px;height:22px;accent-color:var(--accent);margin:2px 0 0}
.tl-row .btn.small{margin-top:2px}

.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:10px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.7rem .8rem;display:flex;flex-direction:column;gap:2px;min-width:0}
.fact b{font:700 1.5rem/1.1 var(--f-price);font-variant-numeric:tabular-nums}
.fact span{font-size:.8rem;color:var(--ink-2)}
.dish{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:.7rem 0;border-bottom:1px solid var(--line)}
.dish>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.dish i{width:12px;height:12px;border-radius:50%;background:var(--c);margin-top:10px}
.dish-n{font-weight:600}
.dish-s{font-size:.82rem;color:var(--ink-2)}
details summary{cursor:pointer;font-size:.85rem;color:var(--accent);font-weight:600}
.ings{list-style:none;margin:6px 0 0;padding:0}
.ings li{display:flex;justify-content:space-between;gap:12px;padding:.3rem 0;border-bottom:1px solid var(--line);font-size:.88rem}
.ings li:last-child{border-bottom:0}
.ings .q{font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.fine{font-size:.8rem;color:var(--ink-2);margin:0;max-width:65ch}

.grp{display:flex;flex-direction:column;gap:4px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0;font:800 1.1rem var(--f-display)}
.grp-h span{font:500 .8rem var(--f-body);color:var(--ink-2);text-align:right}
.sub-h{font:700 .74rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:.6rem 0 0}
.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:.6rem 0;border-bottom:1px solid var(--line)}
.item input{width:22px;height:22px;accent-color:var(--accent);margin:0}
.item-body{min-width:0;display:flex;flex-direction:column;gap:1px;cursor:pointer}
.item-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.item-n{font-weight:600}
.item-q{color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:.9rem}
.item-sub{font-size:.8rem;color:var(--ink-2);overflow-wrap:anywhere}
.item-left{font-size:.8rem;color:var(--accent);font-weight:600}
.item.done .item-n,.item.done .item-q{text-decoration:line-through;color:var(--ink-2)}
.totals{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-top:2px solid var(--ink);padding-top:10px;font-size:.92rem}
.totals b{font:700 1.5rem/1 var(--f-price);font-variant-numeric:tabular-nums}
.copybox{width:100%;min-height:180px;font:.85rem/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}

.acts{list-style:none;margin:0;padding:0}
.act{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--line)}
.act-txt{min-width:0;display:flex;flex-direction:column;gap:3px}
.act-n{font-weight:600;overflow-wrap:anywhere}
.act-d{font-size:.8rem;color:var(--ink-2);overflow-wrap:anywhere}
.last{color:var(--promo);font-weight:700}

.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 1.3rem/1 var(--f-body);cursor:pointer}
.stepper output{font:700 2rem/1 var(--f-price);min-width:1.5ch;text-align:center;font-variant-numeric:tabular-nums}
.stepper span{color:var(--ink-2);font-size:.9rem}
.srcs{list-style:none;margin:0;padding:0;font-size:.88rem}
.srcs li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:.4rem 0;border-bottom:1px solid var(--line)}
.srcs span{color:var(--ink-2);text-align:right;overflow-wrap:anywhere;min-width:0}
.srcs b{font-weight:600;min-width:0;overflow-wrap:anywhere}

.wk{display:grid;grid-template-columns:minmax(0,1fr) 76px 76px;gap:6px 8px;align-items:center}
.wk-h{font:700 .74rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-align:center}
.wk-d{font-weight:600}
.tog{appearance:none;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--accent-ink);font:700 1.1rem var(--f-body);cursor:pointer}
.tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.count{margin:0;font-size:.88rem;color:var(--ink-2)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{appearance:none;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;padding:.8rem .9rem;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:600 .95rem/1.3 var(--f-body);cursor:pointer}
.opt>span:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.opt small{font-weight:400;font-size:.82rem;color:var(--ink-2)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.opt[aria-pressed="true"] .dot{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 42%,transparent 47%)}
.pill{flex:none;font:700 .8rem var(--f-body);padding:.25rem .6rem;border-radius:999px;background:var(--tag-plain);color:var(--ink-2)}
.opt[aria-pressed="true"] .pill{background:var(--accent);color:var(--accent-ink)}

.quiz{display:flex;flex-direction:column;gap:18px}
.qfoot{display:flex;gap:10px;flex-wrap:wrap;padding-top:4px}
.qfoot .btn{flex:1;min-width:8rem}
.hint{color:var(--promo);font-size:.88rem;font-weight:600;margin:0}
.wbar{position:sticky;bottom:0;z-index:5;background:var(--paper);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.wbar-s{font-size:.88rem;color:var(--ink-2);margin:0}
.wbar-s b{color:var(--ink)}

.timers{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:8;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.timers-in{max-width:640px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.timer{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);border-radius:999px;padding:.4rem .5rem .4rem .8rem;font-size:.85rem}
.timer span{max-width:12rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer b{font:700 1.05rem var(--f-price);font-variant-numeric:tabular-nums}
.timer.ring{background:var(--promo);color:var(--promo-ink)}

  return r._g=g;
}
function allowed(r){
  var p=S.prefs,f=rflags(r);
  if(p.ban.indexOf(r.id)>=0) return false;
  if(!p.oven&&hasTag(r,'ov')) return false;
  if(p.spice===0&&hasTag(r,'sp2')) return false;
  if(p.diet==='vege'&&/[mf]/.test(f)) return false;
  if(p.diet==='pesce'&&f.indexOf('m')>=0) return false;

function algLetter(a){for(var i=0;i<ALG.length;i++) if(ALG[i][0]===a) return ALG[i][2];return '';}
function algOK(r){
  var A=S.prefs.alg;
  for(var i=0;i<A.length;i++){
    var a=A[i],L=algLetter(a);
    if(!L||a==='lactose') continue;
    for(var j=0;j<r.all.length;j++){
      var k=r.all[j][0];
      if(ING[k].f.indexOf(L)>=0&&!(SUBST[a]&&SUBST[a][k])) return false;

}
/* ---------- valeurs nutritionnelles et catégories ---------- */
function macros(r){
  if(r._m) return r._m;
  var t=[0,0,0,0];
  r.all.forEach(function(x){
    var n=NUT[x[0]];if(!n) return;
    var q=x[1]||n[4]||0,f=ING[x[0]].u==='pc'?q:q/100;
    for(var i=0;i<4;i++) t[i]+=n[i]*f;

  return r._m={k:t[0]/4,p:t[1]/4,c:t[2]/4,f:t[3]/4};
}
function apF(){return S.prefs.big?1.25:1;}
function isFit(r){var m=macros(r);return m.p>=28&&m.k<=620&&m.f*9<=m.k*0.35;}
function kcal(v){return Math.round(v/10)*10;}
function macroTxt(r,f){var m=macros(r);f=f||1;return '≈ '+kcal(m.k*f)+' kcal et '+Math.round(m.p*f)+' g de protéines par portion';}
function macroHtml(r,f){
  var m=macros(r);f=f||1;
  return '<p class="macros"><span><b>'+kcal(m.k*f)+'</b> kcal</span><span><b>'+Math.round(m.p*f)+' g</b> protéines</span><span>'+Math.round(m.c*f)+' g glucides · '+Math.round(m.f*f)+' g lipides</span></p>';
}
function hasIng(r,ks){return r.all.some(function(x){return ks.indexOf(x[0])>=0;});}
var CATS=[
 ['all','Tout'],
 ['fit','Fit et protéiné',function(r){return isFit(r);}],
 ['leger','Moins de 500 kcal',function(r){return macros(r).k<500;}],
 ['prot','40 g de protéines ou plus',function(r){return macros(r).p>=40;}],
 ['express','Express, 20 min de travail',function(r){return r.act<=25;}],
 ['mij','Mijotés et currys',function(r){return hasTag(r,'mij');}],
 ['sou','Soupes',function(r){return hasTag(r,'sou');}],
 ['bowl','Bowls et salades',function(r){return hasTag(r,'bowl');}],
 ['ff','Burgers, wraps et kebab',function(r){return hasTag(r,'ff');}],
 ['four','Au four et gratins',function(r){return hasTag(r,'ov');}],
 ['pates','Pâtes et gnocchi',function(r){return hasIng(r,['pates','lasagne','gnocchi','pates_farcies']);}],
 ['riz','Riz et nouilles',function(r){return hasIng(r,['riz','riz_risotto','nouilles']);}],
 ['eco','Petit budget',function(r){return hasTag(r,'eco');}],
 ['fav','Mes favoris',function(r){return S.prefs.fav.indexOf(r.id)>=0;}]
];
var PROTS=[['all','Tout'],['poulet','Volaille'],['viande','Bœuf, porc, agneau'],['poisson','Poisson et fruits de mer'],['vege','Végétarien']];
function protOf(r){var g=rgroup(r);return g==='poulet'||g==='poisson'||g==='vege'?g:'viande';}
function catOK(r,c){if(!c||c==='all') return true;for(var i=0;i<CATS.length;i++) if(CATS[i][0]===c) return CATS[i][2](r);return true;}
function matchWz(r,wz){return catOK(r,wz.cat)&&(!wz.prot||wz.prot==='all'||protOf(r)===wz.prot);}
function variantOf(k){
  var A=S.prefs.alg,out=[];
  A.forEach(function(a){
    var L=algLetter(a);
    if(!L||ING[k].f.indexOf(L)<0) return;
    var v=a==='lactose'?(A.indexOf('lait')>=0?'':'sans lactose'):(SUBST[a]&&SUBST[a][k]);
    if(v&&out.indexOf(v)<0) out.push(v);
  });
  return out.join(', ');
}
function roundQ(k,q){
  if(!q) return 0;
  if(ING[k].u==='pc') return Math.max(1,Math.ceil(q-0.01));
  if(q>=100) return Math.round(q/10)*10;
  return Math.max(5,Math.round(q/5)*5);
}
function grams(k,q){return ING[k].u==='pc'?q*ING[k].w:q;}
function needOf(r,k,p){
  var s=0;r.all.forEach(function(x){if(x[0]===k) s+=x[1];});
  return roundQ(k,s*p/4);
}
function mealDeal(r,D,p){
  var top=null,ts=0;
  r.main.forEach(function(k){
    var g=grams(k,needOf(r,k,p)),a=best(k,g,D);
    if(!a) return;
    var s=dscore(a,g);
    if(s>ts){ts=s;top=a;}
  });
  return top?{a:top,s:ts}:null;
}
function rscore(r,D,p){
  var md=mealDeal(r,D,p),s=md?md.s:0,sec=0;
  r.all.forEach(function(i){
    var k=i[0];
    if(r.main.indexOf(k)>=0||ING[k].r==='pl') return;
    var a=best(k,grams(k,needOf(r,k,p)),D,{minPct:1,over:4});
    if(a) sec+=Math.min(a.pct,50)*0.1;
  });
  return s+Math.min(sec,12);
}
function spiceOf(r){return hasTag(r,'sp2')?2:hasTag(r,'sp1')?1:0;}
function baseScore(r,D,p,thisWeek){
  var P=S.prefs,s=rscore(r,D,p)*(P.prio==='eco'?1.3:1),sp=spiceOf(r);
  if(P.prio==='eco'&&hasTag(r,'eco')) s+=8;
  if(P.cu.length&&P.cu.indexOf(r.cu)>=0) s+=P.prio==='var'?20:12;
  if(P.fav.indexOf(r.id)>=0) s+=12;
  if(P.spice===0&&sp===1) s-=10;
  if(P.spice===2&&sp>0) s+=6;
  if(P.freezer&&r.co) s+=4;
  var m=macros(r);
  if(P.goal==='fit'){if(isFit(r)) s+=14;else if(m.k>700) s-=12;s+=Math.max(-6,Math.min(6,(m.p-30)*0.3));}
  else if(P.goal==='muscle'){s+=Math.max(-10,Math.min(14,(m.p-32)*0.7));if(m.k<450) s-=4;}
  P.hist.filter(function(x){return x.w!==thisWeek;}).forEach(function(x,ix){if(x.ids.indexOf(r.id)>=0) s-=ix===0?25:12;});
  return s;
}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){var a=seed;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- semaine : repas couverts et répartition frigo / congélateur ---------- */
function cookOf(shopD,shopH,mode,cookH){
  if(mode==='next') return {d:addDays(shopD,1),h:isHM(cookH)?cookH:'10:00'};
  var m=Math.ceil((toMin(shopD,shopH)+75)/15)*15;
  return {d:dOf(m),h:hm(m)};
}
function slotsBetween(cookD,startMin,endMin){
  var g=S.prefs.grid,out=[];
  for(var o=0;o<=7;o++){
    var d=addDays(cookD,o),wd=wdOf(d);
    for(var m=0;m<2;m++){
      if(!g[wd*2+m]) continue;
      var tm=toMin(d,MEALH[m]);
      if(tm>=endMin&&tm<startMin+7*1440) out.push({d:d,m:m,dd:o});
    }
  }
  return out;
}
/* Les plats qui ne se congèlent pas passent en premier ; chaque plat revient à peu près autant de fois que les autres. */
function assign(slots,ids){
  var P=S.prefs,R=ids.map(function(id){return B[id];}).filter(Boolean),k=R.length,n=slots.length;
  if(!k) return slots.map(function(s){return {d:s.d,m:s.m,r:'',src:'libre'};});
  var L=R.map(function(r){return P.freezer&&r.co?99:r.fr;});
  var order=R.map(function(r,i){return i;}).sort(function(a,b){return L[a]-L[b];});
  var quota=R.map(function(){return Math.floor(n/k);});
  for(var x=0;x<n%k;x++) quota[order[order.length-1-x]]++;
  var res=[],prev=-1,prevDay='',dayUsed={};
  slots.forEach(function(s,si){
    var top=-1,bs=-1e9;
    R.forEach(function(r,i){
      if(s.dd>L[i]) return;
      var rem=0;for(var j=si;j<n;j++) if(slots[j].dd<=L[i]) rem++;
      var sc=quota[i]>0?quota[i]/rem*10:-8+(L[i]>10?2:0);
      if(i===prev&&!(quota[i]>=rem)) sc-=6;
      if(dayUsed[s.d+'#'+i]) sc-=3;
      if(sc>bs){bs=sc;top=i;}
    });
    if(top<0){res.push({d:s.d,m:s.m,r:'',src:'libre'});prev=-1;return;}
    quota[top]--;prev=top;dayUsed[s.d+'#'+top]=1;
    res.push({d:s.d,m:s.m,r:R[top].id,src:s.dd===0?'frais':(s.dd<=R[top].fr?'frigo':'congel')});
  });
  return res;
}
function portionsOf(w,id){var n=0;w.slots.forEach(function(s){if(s.r===id) n++;});return n*w.people;}
function buildWeek(shopD,shopH,mode,cookH,ids){
  var c=cookOf(shopD,shopH,mode,cookH),start=toMin(c.d,c.h);
  var w={shop:{d:shopD,h:shopH},mode:mode,cookH:cookH,cook:c,ids:ids.slice(),people:S.prefs.people,ap:S.prefs.big?1.25:1,slots:[],done:{},checked:{}};
  var end=start+150;
  for(var pass=0;pass<2;pass++){
    w.slots=assign(slotsBetween(c.d,start,end),ids);
    var se=start+session(w).span;
    if(se===end) break;
    end=se;
  }
  w.ids=ids.filter(function(id){return portionsOf(w,id)>0;});
  return w;
}

/* ---------- session de batch cooking ---------- */
var SESS={};
function session(w){
  var key=JSON.stringify([w.cook.d,w.ids,w.slots.map(function(s){return s.r+s.src;}),w.people]);
  if(SESS[key]) return SESS[key];
  var nodes=[{ri:-1,rid:'',a:5,p:0,eq:'',deps:[],txt:'',kind:'start'}];
  w.ids.forEach(function(id,ri){
    var r=B[id],por=portionsOf(w,id);
    if(!r||!por) return;
    var f=Math.min(2,1+0.15*(por/4-1)),base=nodes.length,succ={};
    r.st.forEach(function(s,i){
      var a=s[0],p=s[1],eq=s[2]||'';
      if(!eq&&p===0) a=Math.round(a*f);
      var deps=s[4]===undefined?(i>0?[base+i-1]:[0]):(s[4].length?s[4].map(function(j){return base+j;}):[0]);
      deps.forEach(function(d){succ[d]=1;});
      nodes.push({ri:ri,rid:id,a:Math.max(1,a),p:p,eq:eq,deps:deps,txt:s[3],kind:'step'});
    });
    var sinks=[];for(var i=base;i<nodes.length;i++) if(!succ[i]) sinks.push(i);
    nodes.push({ri:ri,rid:id,a:1,p:25,eq:'',deps:sinks,txt:'Laisse tiédir à découvert, 25 minutes au plus.',kind:'cool'});
    nodes.push({ri:ri,rid:id,a:4,p:0,eq:'',deps:[nodes.length-1],txt:packText(w,r),kind:'pack'});
  });
  var N=nodes.length,pr=new Array(N),succs=nodes.map(function(){return [];});
  nodes.forEach(function(n,i){n.deps.forEach(function(d){succs[d].push(i);});});
  for(var i=N-1;i>=0;i--){var m=0;succs[i].forEach(function(s){if(pr[s]>m) m=pr[s];});pr[i]=nodes[i].a+nodes[i].p+m;}
  var startT=new Array(N).fill(-1),endT=new Array(N).fill(-1),burn=[],oven=[],cook=0,done=0,t=0;
  function okAt(n,t){
    var m,o;
    if(n.eq==='f'){for(m=t;m<t+n.a+n.p;m++) if((burn[m]||0)>=BURNERS) return false;}
    else if(n.eq.charAt(0)==='o'){for(m=t+n.a;m<t+n.a+n.p;m++){o=oven[m];if(o&&(o.temp!==n.eq||o.c>=2)) return false;}}
    return true;
  }
  while(done<N&&t<3000){
    if(cook<=t){
      var top=-1,bp=-1;
      for(i=0;i<N;i++){
        if(startT[i]>=0) continue;
        var n=nodes[i],ready=n.deps.every(function(d){return endT[d]>=0&&endT[d]<=t;});
        if(!ready||!okAt(n,t)) continue;
        if(pr[i]>bp){bp=pr[i];top=i;}
      }
      if(top>=0){
        var nn=nodes[top],m2;
        startT[top]=t;endT[top]=t+nn.a+nn.p;cook=t+nn.a;done++;
        if(nn.eq==='f') for(m2=t;m2<endT[top];m2++) burn[m2]=(burn[m2]||0)+1;
        else if(nn.eq.charAt(0)==='o') for(m2=t+nn.a;m2<endT[top];m2++){if(!oven[m2]) oven[m2]={temp:nn.eq,c:0};oven[m2].c++;}
        continue;
      }
    }
    t++;
  }
  var tasks=nodes.map(function(n,i){return {t:startT[i],a:n.a,p:n.p,eq:n.eq,ri:n.ri,rid:n.rid,txt:n.txt,kind:n.kind};});
  tasks[0].txt='Sors tous les ingrédients, lave les légumes et prépare '+boxCount(w).all+' boîtes avec couvercle.';
  var ov=tasks.filter(function(x){return x.eq.charAt(0)==='o';}).sort(function(a,b){return (a.t+a.a)-(b.t+b.a);}),extra=[];
  if(ov.length){
    var first=ov[0];
    extra.push({t:Math.max(0,first.t+first.a-12),a:1,p:0,eq:'',ri:-1,rid:'',txt:'Préchauffe le four à '+first.eq.slice(1)+' °C.',kind:'oven'});
    for(var k=1;k<ov.length;k++) if(ov[k].eq!==ov[k-1].eq) ov[k].txt='Règle le four à '+ov[k].eq.slice(1)+' °C. '+ov[k].txt;
  }
  tasks=tasks.concat(extra).sort(function(a,b){return a.t-b.t||a.ri-b.ri;});
  var busy=tasks.filter(function(x){return x.kind!=='oven';}).map(function(x){return [x.t,x.t+x.a];}).sort(function(a,b){return a[0]-b[0];});
  var free=[],cur=0;
  busy.forEach(function(b){if(b[0]-cur>=12) free.push({t:cur,a:b[0]-cur,p:0,eq:'',ri:-1,rid:'',txt:'Temps libre : lave la vaisselle et range le plan de travail.',kind:'free'});if(b[1]>cur) cur=b[1];});
  tasks=tasks.concat(free).sort(function(a,b){return a.t-b.t||(a.kind==='free')-(b.kind==='free');});
  var span=0,act=0,maxB=0;
  endT.forEach(function(e){if(e>span) span=e;});
  nodes.forEach(function(n){act+=n.a;});
  burn.forEach(function(b){if(b>maxB) maxB=b;});
  var temps=[];ov.forEach(function(x){var tp=x.eq.slice(1);if(temps.indexOf(tp)<0) temps.push(tp);});
  return SESS[key]={tasks:tasks,span:span,act:act,burners:maxB,temps:temps};
}
function boxCount(w){
  var f=0,c=0,all=0;
  w.slots.forEach(function(s){if(!s.r||s.src==='frais') return;all++;if(s.src==='congel') c++;else f++;});
  return {fridge:f,freezer:c,all:all};
}
function packText(w,r){
  var f=0,c=0,now=0,lastF='';
  w.slots.forEach(function(s){if(s.r!==r.id) return;if(s.src==='frais') now++;else if(s.src==='congel') c++;else{f++;lastF=s.d;}});
  var por=w.people>1?' de '+w.people+' portions':'',parts=[];
  if(now) parts.push('garde '+(w.people>1?w.people+' portions':'une portion')+' pour ce soir');

/* ---------- agenda ---------- */
function events(w){

    var j=r.jour.filter(function(x){return ING[x[0]].r!=='pl';}).map(function(x){var vt=variantOf(x[0]);return lc(ING[x[0]].n)+(vt?' '+vt:'')+' '+fmtQty(x[0],roundQ(x[0],x[1]*w.people/4*(w.ap||1)));});
    ev.push({tm:tm,kind:'meal',k:s.m?'Soir':'Midi',rid:r.id,src:s.src,txt:r.n+(r.sv?', '+r.sv:''),sub:r.j+(j.length?' Il te faut : '+j.join(', ')+'.':'')+' Par portion : '+macroTxt(r,w.ap||1).replace(' par portion','')+'.',len:90});
    if(s.src==='congel'){

  });

  });

function weekOver(w){var start=toMin(w.cook.d,w.cook.h);return nowMin()>start+7*1440-60;}
function nextEvent(ev){var n=nowMin();for(var i=0;i<ev.length;i++) if(ev[i].tm+ev[i].len>=n) return ev[i];return null;}
function programText(w){

  });
  return lines.join('\n').replace(/\n\n\n/g,'\n\n');

/* ---------- liste de courses ---------- */
function shopping(w){
  var D=w.shop.d,need={},order=[],mains={};
  w.ids.forEach(function(id){
    var r=B[id],por=portionsOf(w,id);
    if(!r||!por) return;
    r.main.forEach(function(k){mains[k]=1;});
    r.all.forEach(function(x){
      if(!(x[0] in need)){need[x[0]]=0;order.push(x[0]);}
      need[x[0]]+=x[1]*por/4*(w.ap||1);
    });
  });
  var out={byStore:{},rest:{},placard:[],pick:{},pay:0,save:0,n:0},anchors=[];
  var rows=order.map(function(k){var q=roundQ(k,need[k]);return {k:k,q:q,g:grams(k,q),a:null,c:null};});
  rows.forEach(function(row){
    if(!mains[row.k]) return;
    row.a=best(row.k,row.g,D);
    if(row.a&&anchors.indexOf(row.a.st)<0) anchors.push(row.a.st);
  });
  rows.forEach(function(row){if(!mains[row.k]) row.a=best(row.k,row.g,D,{stores:anchors,minPct:1,over:4});});
  rows.forEach(function(row){
    var k=row.k,a=row.a;
    if(a){row.c=cost(a,row.g);out.pick[k]=a;}
    if(ING[k].r==='pl'){out.placard.push(row);return;}
    out.n++;
    if(a){(out.byStore[a.st]=out.byStore[a.st]||[]).push(row);out.pay+=row.c.total;out.save+=row.c.save;}
    else (out.rest[ING[k].r]=out.rest[ING[k].r]||[]).push(row);
  });
  Object.keys(out.byStore).forEach(function(st){out.byStore[st].sort(function(a,b){return RORDER.indexOf(ING[a.k].r)-RORDER.indexOf(ING[b.k].r);});});
  return out;
}
function fmtQtyG(g){return g>=1000?fr(g/1000)+' kg':g+' g';}
function packsTxt(row){
  var a=row.a,c=row.c,parts=[];
  if(a.u==='pack'){
    if(c.packs>1) parts.push(c.packs+' paquets');

function targetDishes(n){
  var p=S.prefs.nDish;
  if(p) return p;
  return n<=4?2:n<=8?3:n<=12?4:5;
}
function proposals(wz){
  var c=cookOf(wz.shopD,wz.shopH,wz.mode,wz.cookH),start=toMin(c.d,c.h);
  var sl=slotsBetween(c.d,start,start+150),n=S.prefs.freezer?sl.length:sl.filter(function(x){return x.dd<=3;}).length,t=targetDishes(n),por=Math.max(2,Math.round(n/Math.max(1,t)))*S.prefs.people;
  var rand=rng(hash(wz.shopD+'#'+(wz.seed||0)));
  var list=BATCH.filter(allowed).map(function(r){return {r:r,s:baseScore(r,wz.shopD,por,wz.shopD)+rand()*8,md:mealDeal(r,wz.shopD,por)};})
    .sort(function(a,b){return b.s-a.s;});
  return {list:list,n:n,target:t,por:por};
}
function autoPick(wz){
  var pr=proposals(wz),picks=wz.picks.slice(),P=S.prefs;
  function ok(r,strict){
    var g=rgroup(r),groups=picks.map(function(id){return rgroup(B[id]);}),cus=picks.map(function(id){return B[id].cu;});
    var ovens=picks.filter(function(id){return hasTag(B[id],'ov');}).length,fresh=picks.filter(function(id){return !B[id].co;}).length;
    if(P.diet==='flexi'&&g!=='vege'&&groups.some(function(x){return x!=='vege';})) return false;
    if(!strict) return true;
    if(g!=='vege'&&groups.indexOf(g)>=0) return false;
    if(cus.filter(function(x){return x===r.cu;}).length>=1) return false;
    if(hasTag(r,'ov')&&ovens>=2) return false;
    if(!r.co&&(fresh>=1||!P.freezer&&fresh>=2)) return false;
    return true;
  }
  [[true,true],[false,true],[true,false],[false,false]].forEach(function(o){
    pr.list.forEach(function(c){
      if(picks.length>=pr.target||picks.indexOf(c.r.id)>=0) return;
      if(o[1]&&!matchWz(c.r,wz)) return;
      if(ok(c.r,o[0])) picks.push(c.r.id);
    });
  });
  return picks;
}

function icsDate(m){var d=new Date(m*60000);function z(n){return ('0'+n).slice(-2);}return d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'T'+z(d.getHours())+z(d.getMinutes())+'00';}
function icsEsc(x){return String(x).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');}
function icsFold(line){var out=[];while(line.length>60){out.push(line.slice(0,60));line=' '+line.slice(60);}out.push(line);return out.join('\r\n');}
function icsText(w){
  var stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mitonne//Batch cooking//FR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Mitonne'];
  events(w).filter(function(e){return e.kind!=='meal';}).forEach(function(e,i){
    var len=e.kind==='cook'?e.len:e.kind==='shop'?60:15;
    var title=e.kind==='shop'?'Mitonne · Courses':e.kind==='cook'?'Mitonne · Batch cooking':'Mitonne · Décongeler';
    var desc=e.txt+(e.kind==='shop'?'\n\n'+listText(w):'');
    L.push('BEGIN:VEVENT','UID:mitonne-'+w.cook.d+'-'+e.kind+'-'+i+'@mitonne','DTSTAMP:'+stamp,'DTSTART:'+icsDate(e.tm),'DTEND:'+icsDate(e.tm+len),
      'SUMMARY:'+icsEsc(title),'DESCRIPTION:'+icsEsc(desc),

/* ---------- minuteurs ---------- */
var TIMERS=[],TICK=null,AUDIO=null,WAKE=null;
function beep(){
  try{
    if(!AUDIO) return;
    [0,0.35,0.7].forEach(function(d){
      var o=AUDIO.createOscillator(),g=AUDIO.createGain();
      o.frequency.value=880;o.connect(g);g.connect(AUDIO.destination);
      g.gain.setValueAtTime(0.2,AUDIO.currentTime+d);g.gain.exponentialRampToValueAtTime(0.001,AUDIO.currentTime+d+0.3);
      o.start(AUDIO.currentTime+d);o.stop(AUDIO.currentTime+d+0.3);
    });
  }catch(e){}
}
function startTimer(label,min){
  try{if(!AUDIO){var C=window.AudioContext||window.webkitAudioContext;if(C) AUDIO=new C();}else if(AUDIO.resume) AUDIO.resume();}catch(e){}
  TIMERS.push({id:String(Date.now())+TIMERS.length,label:label,end:Date.now()+min*60000,rang:false});
  if(!TICK) TICK=setInterval(tick,1000);
  tick();toast('Minuteur lancé : '+label+', '+dur(min));
}
function tick(){
  var box=document.getElementById('timers'),inn=document.getElementById('timers-in'),now=Date.now();
  TIMERS=TIMERS.filter(function(x){return !(x.rang&&now-x.end>60000);});
  if(!TIMERS.length){box.hidden=true;clearInterval(TICK);TICK=null;return;}
  box.hidden=false;
  inn.innerHTML=TIMERS.map(function(x){
    var s=Math.max(0,Math.round((x.end-now)/1000)),txt=s?(Math.floor(s/3600)?Math.floor(s/3600)+':':'')+('0'+Math.floor(s%3600/60)).slice(-2)+':'+('0'+s%60).slice(-2):'Prêt';
    if(!s&&!x.rang){x.rang=true;beep();toast(x.label+' : c’est prêt');}
    return '<div class="timer'+(s?'':' ring')+'"><span>'+esc(x.label)+'</span><b>'+txt+'</b><button data-act="timer-x" data-v="'+x.id+'" aria-label="Arrêter le minuteur">×</button></div>';
  }).join('');
}

      prio:p.prio,stores:p.stores.slice(),shopDay:p.shopDay,shopH:p.shopH,thawH:p.thawH,fav:p.fav.slice(),ban:p.ban.slice(),hist:p.hist.slice(),lastFire:p.lastFire||0,alg:p.alg.slice(),big:!!p.big,goal:p.goal,cuv:2},

}
function apply(d){
  if(!d||typeof d!=='object') return;
  var p=d.prefs,P=S.prefs;
  if(p&&typeof p==='object'){
    if(p.people>=1&&p.people<=8) P.people=Math.round(p.people);
    if(Array.isArray(p.grid)&&p.grid.length===14) P.grid=p.grid.map(Boolean);
    if(DIETS.some(function(x){return x[0]===p.diet;})) P.diet=p.diet;
    if(Array.isArray(p.no)) P.no=p.no.filter(function(x){return NO[x];});
    if(Array.isArray(p.cu)){P.cu=p.cu.filter(function(x){return CUIS[x];});if(p.cuv!==2&&P.cu.indexOf('am')>=0&&P.cu.indexOf('mx')<0) P.cu.push('mx');}
    if(GOALS.some(function(x){return x[0]===p.goal;})) P.goal=p.goal;
    if(p.spice===0||p.spice===1||p.spice===2) P.spice=p.spice;
    if(typeof p.oven==='boolean') P.oven=p.oven;
    if(typeof p.freezer==='boolean') P.freezer=p.freezer;
    if([0,2,3,4,5].indexOf(p.nDish)>=0) P.nDish=p.nDish;
    if(p.prio==='eco'||p.prio==='var') P.prio=p.prio;
    if(Array.isArray(p.stores)) P.stores=ORDER.filter(function(s){return p.stores.indexOf(s)>=0;});
    if(p.shopDay==='fri'||p.shopDay==='sat') P.shopDay=p.shopDay;
    if(isHM(p.shopH)) P.shopH=p.shopH;
    if(THAWH.indexOf(p.thawH)>=0) P.thawH=p.thawH;
    if(Array.isArray(p.fav)) P.fav=p.fav.filter(function(id){return B[id];});
    if(Array.isArray(p.ban)) P.ban=p.ban.filter(function(id){return B[id];});
    if(Array.isArray(p.hist)) P.hist=p.hist.filter(function(x){return x&&isIso(x.w)&&Array.isArray(x.ids);}).slice(0,3).map(function(x){return {w:x.w,ids:x.ids.filter(function(id){return B[id];})};});
    if(typeof p.lastFire==='number'&&p.lastFire>0) P.lastFire=p.lastFire;
    if(Array.isArray(p.alg)) P.alg=p.alg.filter(function(x){return algLetter(x);});

      var r=B[s.r]?s.r:'';return {d:s.d,m:s.m,r:r,src:r&&['frais','frigo','congel'].indexOf(s.src)>=0?s.src:'libre'};});
    if(ids.length&&slots.length) S.week={shop:{d:w.shop.d,h:w.shop.h},mode:w.mode==='next'?'next':'after',cookH:isHM(w.cookH)?w.cookH:'10:00',cook:{d:w.cook.d,h:w.cook.h},
      ids:ids,people:w.people>=1&&w.people<=8?w.people:P.people,ap:w.ap===1.25?1.25:1,slots:slots,done:w.done&&typeof w.done==='object'?w.done:{},checked:w.checked&&typeof w.checked==='object'?w.checked:{}};
  }
}
function loadLocal(){try{var raw=localStorage.getItem(LS)||localStorage.getItem(LS_OLD);if(raw) apply(JSON.parse(raw));}catch(e){}}
function save(){
  if(!S.loaded) return;
  dirty=true;clearTimeout(saveT);saveT=setTimeout(flush,500);
}
function flush(){
  if(saving||!dirty) return;
  dirty=false;
  var body=snapshot();
  if(!stateRef){try{localStorage.setItem(LS,JSON.stringify(body));}catch(e){}return;}
  saving=true;
  stateRef.set(body).then(function(){saving=false;if(dirty) flush();},function(){
    saving=false;stateRef=null;
    try{localStorage.setItem(LS,JSON.stringify(body));}catch(e){}
  });
}
function timeout(p,ms){return Promise.race([p,new Promise(function(res){setTimeout(function(){res(undefined);},ms);})]);}
function loaded(){S.loaded=true;render();}
function init(){
  if(WEB){
    loadLocal();S.loaded=true;S.refresh.avail=true;render();
    fetchActions(false);
    try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();}catch(e){}
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
    document.addEventListener('visibilitychange',function(){if(!document.hidden) fetchActions(false);});
    return;
  }
  var slowT=setTimeout(function(){if(S.aState==='loading'){S.aState='slow';render();}},10000);
  var use=window.claude&&typeof window.claude.use==='function'?function(n){return window.claude.use(n).catch(function(){return null;});}:function(){return Promise.resolve(null);};
  use('mcp').then(function(m){
    if(!m){S.refresh.avail=false;render();return;}
    MCP=m;
    m.listTools(MCP_SERVER).then(function(r){
      var sv=(r&&r.servers||[]).filter(function(x){return x.server===MCP_SERVER;})[0];
      S.refresh.avail=!!(sv&&sv.tools.some(function(t){return t.name==='fire_trigger';}));
      if(sv&&sv.authStatus==='needs_reauth'){S.refresh.kind='err';S.refresh.msg='Reconnecte Claude Code Remote dans claude.ai, dans Réglages puis Connecteurs, pour actualiser les promotions.';}
      render();
    },function(){S.refresh.avail=false;render();});
  });
  Promise.all([use('db'),use('user')]).then(function(r){
    var db=r[0],user=r[1];
    if(!db){clearTimeout(slowT);S.aState='off';loadLocal();loaded();return;}
    db.collection('actions').onSnapshot(function(snap){
      var m={};
      snap.docs.forEach(function(d){var b=d.data();if(b&&ORDER.indexOf(d.id)>=0) m[d.id]=b;});
      S.actions=m;flatten();
      if(S.refresh.waiting&&actionsSig()!==S.refresh.sig0){S.refresh.waiting=false;S.refresh.kind='';S.refresh.msg='Promotions mises à jour à '+hm(nowMin())+'.';toast('Promotions mises à jour');}
      if(!snap.metadata||!snap.metadata.fromCache||snap.size){clearTimeout(slowT);S.aState='ready';}
      render();
    },function(){clearTimeout(slowT);if(S.aState!=='ready') S.aState='off';render();});
    var idP=user?Promise.resolve(user.id()).catch(function(){return null;}):Promise.resolve(null);
    timeout(idP,8000).then(function(uid){
      if(!uid){loadLocal();loaded();return;}
      var ref=db.doc('data/users/'+uid+'/state');
      timeout(ref.get().catch(function(){return null;}),8000).then(function(snap){
        if(snap===undefined||snap===null) loadLocal();
        else{stateRef=ref;if(snap.exists) apply(snap.data());}
        loaded();
      });
    });
  });
}
function boot(){

  document.addEventListener('click',onClick);
  document.addEventListener('change',onChange);
  setInterval(function(){if(mode()==='tabs'&&(S.ui.tab==='semaine'||S.ui.tab==='reglages'&&S.refresh.waiting)&&!document.hidden){if(S.refresh.waiting&&!recentFire()) S.refresh.waiting=false;render();}},60000);
  onHash();
  init();
}
